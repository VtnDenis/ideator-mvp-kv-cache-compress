[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-compress"
version = "0.1.0"
description = "eOptShrinkQ KV cache compression for Hugging Face transformers — spectral denoising + 8-bit quantization"
authors = [{name = "KV-Cache-Compress Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
demo = ["datasets", "tqdm"]

[project.urls]
Homepage = "https://github.com/ideator-mvp/kv-cache-compress"
Repository = "https://github.com/ideator-mvp/kv-cache-compress"
